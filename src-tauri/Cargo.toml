[package]
name = "wherry-desktop"
version = "0.3.0"
description = "Desktop shell for the Wherry client"
authors = ["Wherry"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# Stage 0 of docs/prompts/native-media-plan.md: the throwaway probe in
# src/spike.rs. Off by default, so `pnpm tauri dev` and every release build
# are exactly what they were; `pnpm tauri dev --features media-spike
# --config tauri.spike.conf.json` is the one command that turns it on. The
# feature, the module, the three optional dependencies below and the -ObjC
# line in build.rs all go together when the spike is deleted.
media-spike = ["dep:livekit", "dep:tokio", "dep:tokio-stream"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Registration only, keeping the shell's "no IPC, no Rust logic" rule: the
# client's sync engine decides when to notify; this just gives the webview
# the OS notification API the PWA's service worker cannot reach in here.
tauri-plugin-notification = "2"
# Hands external URLs (the release page, later a store listing) to the
# system browser. In a webview an <a href> to another site navigates the
# app itself away, so the update banner and the version-floor wall need
# this to have anywhere to send people. Registration only, like the rest.
tauri-plugin-opener = "2"

# The media spike's SDK (see [features]). A git revision rather than the
# 0.8.4 crate on purpose: PlatformAudio's thread-affinity fix (rust-sdks
# #1212) merged on 2026-09-03 and is not in a published release yet -- the
# plan's §1.3. rustls, never native-tls: libwebrtc links BoringSSL
# statically and a dynamic OpenSSL in the same process crashes at init on
# Linux (the plan's §1.4).
livekit = { git = "https://github.com/livekit/rust-sdks", rev = "dee418bba599fd505fa548ac6b9ab3379fc548fc", features = ["rustls-tls-native-roots"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"], optional = true }
tokio-stream = { version = "0.1", optional = true }

# Desktop only -- there is no second instance to guard against on mobile.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# The OS keychain behind the vault_* commands in lib.rs -- the one place the
# shell holds data rather than merely registering a plugin, and the reason
# is iOS: WebKit may evict an inactive app's IndexedDB and localStorage,
# and without a copy of the account keypair outside the webview that
# eviction is the lost-device path (recovery code or another signed-in
# device). Apple and Windows only: the Linux backend would drag a D-Bus
# secret-service dependency into CI for a platform where eviction is not a
# threat, so Linux builds compile the commands as no-ops instead. Android
# lands in that same no-op branch, and also deliberately: keyring has no
# Android backend, and Chromium's WebView does not evict an installed
# app's private storage the way WebKit may. See docs/mobile-setup.md.
[target.'cfg(any(target_vendor = "apple", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }
