[package]
name = "wherry-desktop"
version = "0.4.0"
description = "Desktop shell for the Wherry client"
authors = ["Wherry"]
license = ""
repository = ""
edition = "2021"
# The locked graph's own floor, not ours: notify-rust (Linux notifications)
# declares 1.89, and time and plist 1.88. The shell's own newest need is
# `Option::is_none_or`, 1.82. Raise this with the lockfile.
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Registration only, keeping the shell's "no IPC, no Rust logic" rule: the
# client's sync engine decides when to notify; this just gives the webview
# the OS notification API the PWA's service worker cannot reach in here.
tauri-plugin-notification = "2"
# Hands external URLs (the release page, later a store listing) to the
# system browser. In a webview an <a href> to another site navigates the
# app itself away, so the update banner and the version-floor wall need
# this to have anywhere to send people. Registration only, like the rest.
tauri-plugin-opener = "2"

# The phone shells' native plugins, in-repo under plugins/ (one directory per
# concern, so parallel work never shares a plugin). THE one mobile table:
# a later plugin adds its line here rather than opening a second table with
# the same cfg (docs/prompts/native-gaps-coordination.md §2). Each is
# registered in lib.rs's one `#[cfg(mobile)]` block.
# wherry-push: APNs and FCM tokens, notification taps, the icon badge
# (docs/prompts/native-push-plan.md §5). Mechanism behind
# client/src/sync/native-push.ts.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-wherry-push = { path = "plugins/wherry-push" }
# wherry-calls: PushKit and CallKit on iOS, the call service and the ring on
# Android (docs/prompts/phone-calls-plan.md §5). Mechanism behind
# client/src/voice/phone-calls.ts; its capability, capabilities/calls-mobile.json,
# names it and so cannot exist without this line.
tauri-plugin-wherry-calls = { path = "plugins/wherry-calls" }

# Desktop only -- there is no second instance to guard against on mobile.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# The native media transport (src/voice/mod.rs; docs/prompts/native-media-plan.md
# §5). Desktop only: the phones keep the webview transport, and this crate
# never enters their graph. A git revision rather than the 0.8.4 release on
# purpose -- PlatformAudio's thread-affinity fix (rust-sdks #1212) merged on
# 2026-09-03 and is not in a published crate yet (the plan's §1.3); bump
# `rev` and LIVEKIT_REV in src/voice/mod.rs together. rustls, never native-tls:
# libwebrtc links BoringSSL statically and a dynamic OpenSSL in the same
# process crashes at init on Linux (the plan's §1.4). Building it downloads
# the prebuilt libwebrtc archive from the SDK's GitHub releases at compile
# time and needs clang 21 on Linux; release.yml carries both.
# Since 2026-09-08 the dependency is the wherryapp fork itself, not upstream
# plus a `[patch]`: six commits sit on top of upstream's dee418bb (the
# cryptor-thread detach; `configure_audio_processing` doing something on
# desktop; a remote track's `set_volume`; since the evening of 2026-09-08 on
# `wherry/stage-3n`, the detach made safe for video receivers -- the null it
# handed them segfaulted the shell the first time a received video track's
# cryptor dropped; since 2026-09-15 on `wherry/windows-console-role`,
# Windows' console default device instead of the communications role, without
# which Windows 11 lowers every other application's sound during a call and
# after it, row S-16; and since 2026-09-29 on the same branch, `Room::close`
# releasing the room session and its PeerConnection, without which each
# received video subscription kept a FrameCryptorTransformer thread for the
# life of the process, spike row 6) and they touch `webrtc-sys`, `libwebrtc`
# and `livekit`, which one patched crate cannot carry. Each is also kept in
# patches/ with its note. When upstream merges them, point this back at
# livekit/rust-sdks and bump `rev` with LIVEKIT_REV in src/voice/mod.rs.
livekit = { git = "https://github.com/wherryapp/rust-sdks", rev = "06f0a5d0c59e41fb94c5f84658ca5207103a1647", features = ["rustls-tls-native-roots"] }
# The runtime is Tauri's; this names the room event receiver's type
# (`sync`) and supplies the timers the shell calls directly (`time`:
# `recheck_microphone`'s sleep, the device poller's and the debug ping's
# intervals in voice/mod.rs). Both are already enabled in the graph through
# livekit and Tauri; stating `time` means the code no longer compiles only
# by feature unification.
tokio = { version = "1", features = ["rt", "sync", "time"] }
# `StreamExt::next` on the SDK's `NativeVideoStream` (voice/render.rs): the
# received-frame path is a `Stream`, and this is already in the graph
# through livekit.
futures-util = "0.3"

# The OS keychain behind the vault_* commands in lib.rs -- the one place the
# shell holds data rather than merely registering a plugin, and the reason
# is iOS: WebKit may evict an inactive app's IndexedDB and localStorage,
# and without a copy of the account keypair outside the webview that
# eviction is the lost-device path (recovery code or another signed-in
# device). Apple and Windows only: the Linux backend would drag a D-Bus
# secret-service dependency into CI for a platform where eviction is not a
# threat, so Linux builds compile the commands as no-ops instead. Android
# lands in that same no-op branch, and also deliberately: keyring has no
# Android backend, and Chromium's WebView does not evict an installed
# app's private storage the way WebKit may. See docs/mobile-setup.md.
[target.'cfg(any(target_vendor = "apple", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Keeping the page scheduled on macOS (lib.rs, "Keeping the page scheduled"):
# one Key-Value-Coding call on the WKWebView, which needs a message send and
# two Foundation types. Both crates are already in the graph through wry and
# tao; this adds no download, only a direct dependency.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSValue"] }
# Native video (voice/capture.rs, voice/render.rs; the next-stages handoff's
# §3, path (b)): the camera is AVFoundation through the same `msg_send!`
# route, and the one completion block it needs -- the camera permission
# prompt's -- is what block2 is for. Already in the graph through objc2.
block2 = "0.6"

# Screen-share audio on Windows (voice/screen_audio.rs; docs/prompts/
# screen-audio-handoff.md §4). WASAPI *process* loopback: the one capture
# that can carry what an application is playing while leaving our own
# process tree out, which is requirement 3 of video-plan.md §10.2 -- a
# share must never send the call's own incoming audio back to the far end.
# Chromium's display capture cannot do that on Windows 10 (row S-01), and
# under WebView2 it cannot open a picker at all (S-00), so this is the
# shell's job rather than the page's.
#
# `windows` 0.61 rather than the 0.62 the probe in scripts/regress used:
# 0.61 is already in this graph through tao and wry, so this adds features
# to a crate that is compiled anyway instead of a second major version of
# it. The API shape is identical at both (checked: the completion handler
# takes the same `Ref<'_, _>`).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  # Native video render (voice/render_win.rs; stage W3). Gdi is not only
  # the blit: 57 items in WindowsAndMessaging are themselves gated on it,
  # `WNDCLASSEXW` and `RegisterClassExW` among them, so a window class
  # cannot be registered without it. All three are already on in the
  # unified graph through tao and wry -- declared here anyway, because a
  # feature we depend on and do not ask for is one their next release can
  # take away without noticing us.
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  # The D3D11 presenter (voice/render_win_d3d.rs; stage W3.2): a device, a
  # swap chain on the tile's HWND, and `ID3D11VideoProcessor` for the
  # NV12-to-BGRA, the scaling and the letterbox. Direct3D (not 11) is the
  # driver-type and feature-level constants; Dxgi_Common the formats.
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  # The camera (voice/capture.rs's `win`; stage W4): Media Foundation's
  # device enumeration and its source reader, read synchronously on one
  # thread. Attributes are read through the typed getters, so nothing here
  # needs a PROPVARIANT.
  "Win32_Media_MediaFoundation",
] }
windows-core = "0.61"
# `NativeAudioSource::capture_frame` is async in signature and synchronous
# underneath on the fast path (queue size 0), and the capture loop is a
# plain std thread with no runtime on it. Already in the graph through
# futures; this makes it a direct dependency for that one call.
futures-executor = "0.3"

# Two crates carried as vendored copies with one fix each, because the iOS
# release build does not launch without both; `vendor/README.md` has the
# faults, the diffs against the published crates, and when to drop them.
# Only the iOS paths change: every other target compiles the published code.
[patch.crates-io]
tao = { path = "vendor/tao" }
swift-rs = { path = "vendor/swift-rs" }
