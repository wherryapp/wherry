name: wherry-desktop
options:
  bundleIdPrefix: app.wherry
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Wherry
      PRODUCT_BUNDLE_IDENTIFIER: app.wherry
      DEVELOPMENT_TEAM: TD6R2M35QU
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  wherry-desktop_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: wherry-desktop_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: wherry-desktop_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # Voice (docs/prompts/voice-plan.md §8). The prompt string iOS shows
        # the first time getUserMedia asks; WKWebView's own permission
        # delegate is auto-granted by wry, so this is the only ask a person
        # sees. Background audio keeps the call's playback alive when the
        # screen locks; capture in the background is a WebKit limit the
        # plan records rather than works around.
        NSMicrophoneUsageDescription: Wherry uses the microphone for voice calls and voice rooms.
        NSCameraUsageDescription: Wherry uses the camera for video calls.
        # Hand edit 10 (docs/prompts/phone-calls-plan.md §7): `voip` lets
        # PushKit wake or launch the app for an incoming call, which the
        # wherry-calls plugin reports to CallKit. Without it PushKit issues
        # no VoIP token. No `remote-notification`: v1 sends no
        # content-available pushes (coordination §2, correction 4).
        UIBackgroundModes: [audio, voip]
        # Hand edit 14 (docs/prompts/regen-hand-edits.md): the UIScene life
        # cycle. UIKit refuses to launch a build from the iOS 27 SDK that has
        # not adopted scenes ("UIScene life cycle is required for apps built
        # with this SDK"). tao 0.35.3 adopts them only when this manifest
        # says UIApplicationSupportsMultipleScenes: it then answers
        # application:configurationForConnectingSceneSession:options: with
        # its own TaoSceneDelegate and defers its launch to the first scene
        # (tao src/platform_impl/ios/{scene,view,app_state}.rs). No
        # UISceneConfigurations: tao supplies the configuration in code. The
        # flag also lets iPadOS open a second window, which Wherry does not
        # handle (row I-76), and a scene that reconnects in a live process
        # is believed to get a blank window (row I-77). Deferring to the
        # first scene defers the webview, the page and every plugin's
        # load(webview:). A background launch (PushKit) is believed to
        # connect no scene, so work that must run then starts from a
        # plugin's init or didFinishLaunching, never from load (edit 14).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    entitlements:
      path: wherry-desktop_iOS/wherry-desktop_iOS.entitlements
      # Hand edit 7 (docs/prompts/native-push-plan.md §5.3): APNs. XcodeGen
      # writes the .entitlements file from these properties on every Tauri
      # build, so the key lives here and in the file, committed together.
      # `development` is what a development-signed build and the simulator
      # carry; Xcode's App Store / TestFlight export rewrites it to
      # `production` from the distribution profile (believed; row I-49).
      # No `remote-notification` background mode: v1 sends no
      # content-available pushes (coordination §2, correction 4).
      properties:
        aps-environment: development
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      # PATH first: GUI Xcode's script phases don't inherit a login shell,
      # so without this a Cmd+R build dies on "pnpm: command not found"
      # (node/pnpm live behind fnm's default alias, cargo in ~/.cargo).
      - script: |
          export PATH="$HOME/.local/share/fnm/aliases/default/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a