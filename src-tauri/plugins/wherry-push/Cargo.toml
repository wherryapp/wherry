[package]
name = "tauri-plugin-wherry-push"
version = "0.1.0"
description = "Native push (APNs, FCM) for the Wherry phone shells"
authors = ["Wherry"]
license = ""
edition = "2021"
rust-version = "1.77.2"
publish = false
# tauri-plugin's build step requires `links`, and it must equal the package
# name: it is how the app's build finds this plugin's permissions.
links = "tauri-plugin-wherry-push"

# Registration only. Every command is native (ios/Sources, android/), and the
# decisions about when to ask, register or open are the client's
# (client/src/sync/native-push.ts). docs/prompts/native-push-plan.md §5.
[dependencies]
tauri = { version = "2.11.3", default-features = false }

# `register_ios_plugin` reaches the webview through `with_webview`, which is
# behind tauri's `wry` feature. The app enables it anyway; declared here so
# this crate does not depend on that unification (tauri-plugin-notification
# declares it the same way).
[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2.11.3", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
