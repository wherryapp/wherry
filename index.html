<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget tells the browser to shrink the layout viewport when
         the on-screen keyboard appears, rather than leaving the page full height
         and scrolling it out of the way. Where it is honoured the app compacts on
         its own and src/ui/viewport.ts has nothing left to correct; where it is
         not, it is ignored and that file is the fallback. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS uses this for the home screen icon rather than the manifest's,
         and it is the platform where the install matters most: web push is
         only delivered to a site that has been added to the home screen. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- Paints the browser and status bar chrome to match the app, which is
         what stops an installed window looking like a web page in a frame.
         Two, because the app follows the system light/dark setting. -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111111"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>messenger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
