<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>video spike</title>
    <style>
      body { font: 13px ui-monospace, monospace; margin: 12px; background: #111; color: #ddd; }
      video { width: 320px; background: #000; border: 1px solid #444; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; }
      pre { white-space: pre-wrap; }
      .k { color: #8bc; }
    </style>
  </head>
  <body>
    <h3 id="who">video spike</h3>
    <div class="row" id="videos"></div>
    <pre id="out">starting…</pre>

    <script type="module">
      // Stage 0 of docs/prompts/video-plan.md, the spike: does camera video
      // survive frame encryption, per codec, on this platform -- and does a
      // peer without the key see black rather than something?
      //
      // Throwaway. This directory is deleted once the plan's go/no-go table
      // is filled in, exactly as the audio spike was on 2026-09-05.
      //
      // Driveable with no clicking, because most of the platforms this has
      // to run on cannot be clicked from here: everything is a query
      // parameter and every reading is on `window.__spike`.
      //
      //   ?identity=alice&publish=1&codec=h264      publisher
      //   ?identity=bob&publish=0                   subscriber, right key
      //   ?identity=eve&publish=0&key=wrong         the third session
      //   &e2ee=0                                    encryption off (control)
      //
      // Parameters: identity, room (default "spike"), publish (default 1),
      // codec (h264 | vp8 | vp9 | av1, default h264), key (any string; the
      // shared passphrase, default "spike-key"), simulcast (default 1),
      // source (camera | canvas, default camera).
      //
      // **Why a canvas source exists.** The browser pane this is driven from
      // refuses camera access, exactly as it refuses the microphone, so a
      // real camera cannot be captured here at all. A canvas `captureStream`
      // is a real video MediaStreamTrack that goes through the same encoder,
      // the same simulcast layers and the same frame cryptor -- which is the
      // whole of stage 0's question. What it does *not* test is the camera
      // permission prompt per platform, and that was never this stage's job;
      // it is stage 7's device pass. The pattern is chosen so the far end can
      // tell a decode from a black frame by a number: a bright block sweeping
      // a dark field, so mean luminance sits well above zero and *moves*.
      // A still image would decode to a plausible-looking frozen frame and
      // prove less.
      import {
        ExternalE2EEKeyProvider,
        Room,
        RoomEvent,
        Track,
      } from "livekit-client";

      const params = new URLSearchParams(location.search);
      const identity = params.get("identity") ?? `id-${Math.random().toString(36).slice(2, 7)}`;
      const roomName = params.get("room") ?? "spike";
      const publish = params.get("publish") !== "0";
      const codec = params.get("codec") ?? "h264";
      const passphrase = params.get("key") ?? "spike-key";
      const simulcast = params.get("simulcast") !== "0";
      // The control that turns "codec X does not work" into "codec X does
      // not work *with frame encryption*", which is a different finding and
      // the only one worth acting on.
      const e2ee = params.get("e2ee") !== "0";

      const out = document.getElementById("out");
      const videos = document.getElementById("videos");
      document.getElementById("who").textContent =
        `${identity} · ${publish ? "publishing" : "watching"} · codec ${codec} · key "${passphrase}"`;

      /** Everything the driver reads. Errors are values here, not throws:
       *  a spike that dies silently on one platform teaches nothing. */
      const state = {
        identity,
        codec,
        publish,
        passphrase,
        simulcast,
        e2ee,
        // Platform facts worth recording per browser, which is half of what
        // the plan's §3 table asks for.
        platform: {
          ua: navigator.userAgent,
          getDisplayMedia: typeof navigator.mediaDevices?.getDisplayMedia === "function",
          insertableStreams: typeof window.RTCRtpSender !== "undefined" &&
            "createEncodedStreams" in RTCRtpSender.prototype,
          scriptTransform: typeof window.RTCRtpScriptTransform !== "undefined",
        },
        phase: "starting",
        sourceUsed: null,
        cameraError: null,
        error: null,
        connected: false,
        published: null,
        remotes: [],
        stats: null,
      };
      window.__spike = state;

      function log() {
        out.textContent = JSON.stringify(state, null, 2);
      }
      log();

      /** Mean luminance of the remote video, 0..255. The wrong-key session's
       *  proof: frames arriving and a black picture is a decode that failed,
       *  and "black" should be a number rather than a judgement. */
      const canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 48;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      function brightness(video) {
        if (!video.videoWidth) return null;
        try {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
          let sum = 0;
          for (let i = 0; i < data.length; i += 4) {
            sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          }
          return Math.round((sum / (data.length / 4)) * 10) / 10;
        } catch (error) {
          // A tainted canvas would be a finding of its own; report it.
          return `error: ${String(error)}`;
        }
      }

      const remoteVideos = new Map();

      async function main() {
        const answer = await fetch(
          `http://localhost:9998/token?room=${encodeURIComponent(roomName)}&identity=${encodeURIComponent(identity)}`,
        ).then((r) => r.json());
        if (answer.error) throw new Error(`token: ${answer.error}`);

        const keyProvider = e2ee ? new ExternalE2EEKeyProvider() : null;
        const worker = e2ee
          ? new Worker(new URL("livekit-client/e2ee-worker", import.meta.url), { type: "module" })
          : null;
        const room = new Room({
          adaptiveStream: false,
          dynacast: false,
          publishDefaults: { videoCodec: codec, simulcast },
          ...(keyProvider && worker ? { e2ee: { keyProvider, worker } } : {}),
        });
        window.__room = room;

        room
          .on(RoomEvent.TrackSubscribed, (track, _pub, participant) => {
            if (track.kind !== Track.Kind.Video) return;
            const el = track.attach();
            el.autoplay = true;
            el.playsInline = true;
            el.muted = true;
            videos.appendChild(el);
            remoteVideos.set(participant.identity, el);
            state.phase = "subscribed";
            log();
          })
          .on(RoomEvent.EncryptionError, (error) => {
            // Expected, loudly, in the wrong-key session.
            state.encryptionError = String(error?.message ?? error);
            log();
          })
          .on(RoomEvent.Disconnected, (reason) => {
            state.phase = `disconnected (${reason})`;
            log();
          });

        if (keyProvider) await keyProvider.setKey(passphrase);
        await room.connect(answer.url, answer.token);
        if (keyProvider) await room.setE2EEEnabled(true);
        state.connected = true;
        state.phase = "connected";
        log();

        if (publish) {
          await startPublishing(room);
          const pub = room.localParticipant.getTrackPublication(Track.Source.Camera);
          const el = pub?.track?.attach();
          if (el) {
            el.autoplay = true;
            el.playsInline = true;
            el.muted = true;
            videos.appendChild(el);
          }
          const settings = pub?.track?.mediaStreamTrack?.getSettings?.() ?? {};
          state.published = {
            source: state.sourceUsed,
            sid: pub?.trackSid ?? null,
            width: settings.width ?? null,
            height: settings.height ?? null,
            frameRate: settings.frameRate ?? null,
            deviceLabel: pub?.track?.mediaStreamTrack?.label ?? null,
          };
          state.phase = "published";
          log();
        }

        // One sample every two seconds, the same cadence the app's details
        // panel uses. Deltas are the driver's business; this reports totals.
        setInterval(() => void sample(room), 2000);
      }

      /**
       * A moving bright block on a dark field, as a real video track.
       *
       * Driven by `setInterval`, **not** `requestAnimationFrame`, and that
       * is load-bearing rather than taste: the browser pane shows one tab
       * at a time, so the publisher is hidden the moment a subscriber tab
       * exists, and rAF does not fire on a hidden page at all. The first
       * attempt at this encoded exactly **one** frame and then sat at
       * `bytesSent: 0` on the high layer forever, which reads convincingly
       * like a broken codec and is nothing of the kind. A timer is throttled
       * on a hidden page (about 1 Hz) but it does fire, so frames keep
       * coming and every reading below stays honest -- except the frame
       * *rate*, which on a hidden publisher measures the pane and not the
       * encoder. Read fps from a foreground tab or from a real device.
       */
      function canvasTrack() {
        const c = document.createElement("canvas");
        c.width = 640;
        c.height = 480;
        const g = c.getContext("2d");
        let t = 0;
        const draw = () => {
          t += 1;
          g.fillStyle = "#101018";
          g.fillRect(0, 0, c.width, c.height);
          // The bright block: about a fifth of the frame, sweeping, so mean
          // luminance is comfortably non-zero and never constant.
          const x = (t * 6) % (c.width + 200) - 200;
          g.fillStyle = "#f0f0e0";
          g.fillRect(x, 120, 200, 240);
          g.fillStyle = "#40c090";
          g.fillRect(0, 0, c.width, 40);
          // A frame counter, so a still frame at the far end is visible as
          // one rather than mistaken for a working stream.
          g.fillStyle = "#000";
          g.font = "28px monospace";
          g.fillText(`${identity} ${t}`, 12, 30);
        };
        draw();
        setInterval(draw, 33);
        const [track] = c.captureStream(30).getVideoTracks();
        return track;
      }

      /** Camera if asked and allowed, canvas otherwise -- recording which,
       *  because a reading is worthless without knowing its source. */
      async function startPublishing(room) {
        const wanted = params.get("source") ?? "camera";
        if (wanted === "camera") {
          try {
            await room.localParticipant.setCameraEnabled(true);
            state.sourceUsed = "camera";
            return;
          } catch (error) {
            state.cameraError = String(error?.name ?? error);
            // Fall through: a spike that stops here answers nothing.
          }
        }
        const { LocalVideoTrack } = await import("livekit-client");
        const track = new LocalVideoTrack(canvasTrack());
        await room.localParticipant.publishTrack(track, {
          source: Track.Source.Camera,
          videoCodec: codec,
          simulcast,
        });
        state.sourceUsed = "canvas";
      }

      async function sample(room) {
        const reading = { at: new Date().toISOString(), outbound: null, inbound: [] };
        const local = room.localParticipant.getTrackPublication(Track.Source.Camera)?.track;
        if (local?.sender) {
          try {
            const report = await local.sender.getStats();
            report.forEach((s) => {
              if (s.type !== "outbound-rtp" || s.kind !== "video") return;
              // Simulcast gives several; keep the largest, which is the one
              // the encoder string is worth reading from.
              const entry = {
                encoderImplementation: s.encoderImplementation ?? null,
                mimeType: report.get(s.codecId)?.mimeType ?? null,
                width: s.frameWidth ?? null,
                height: s.frameHeight ?? null,
                framesSent: s.framesSent ?? null,
                framesPerSecond: s.framesPerSecond ?? null,
                bytesSent: s.bytesSent ?? null,
                rid: s.rid ?? null,
              };
              if (!reading.outbound || (entry.width ?? 0) > (reading.outbound.width ?? 0)) {
                reading.outbound = entry;
              }
            });
          } catch (error) {
            reading.outboundError = String(error);
          }
        }
        for (const participant of room.remoteParticipants.values()) {
          const pub = participant.getTrackPublication(Track.Source.Camera);
          const track = pub?.track;
          if (!track) continue;
          try {
            const report = await track.receiver.getStats();
            report.forEach((s) => {
              if (s.type !== "inbound-rtp" || s.kind !== "video") return;
              reading.inbound.push({
                from: participant.identity,
                decoderImplementation: s.decoderImplementation ?? null,
                mimeType: report.get(s.codecId)?.mimeType ?? null,
                width: s.frameWidth ?? null,
                height: s.frameHeight ?? null,
                // The three numbers that separate "decrypted" from "arriving
                // but unopenable": bytes climb either way, frames only decode
                // when the key is right.
                bytesReceived: s.bytesReceived ?? null,
                framesReceived: s.framesReceived ?? null,
                framesDecoded: s.framesDecoded ?? null,
                framesDropped: s.framesDropped ?? null,
                brightness: brightness(remoteVideos.get(participant.identity) ?? document.createElement("video")),
              });
            });
          } catch (error) {
            reading.inbound.push({ from: participant.identity, error: String(error) });
          }
        }
        state.stats = reading;
        state.remotes = [...room.remoteParticipants.values()].map((p) => p.identity);
        log();
      }

      main().catch((error) => {
        state.phase = "failed";
        state.error = String(error?.stack ?? error);
        log();
      });
    </script>
  </body>
</html>
